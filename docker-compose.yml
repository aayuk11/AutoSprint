services:
  sprint-report:
    build: .
    image: sprint-report-generator
    container_name: sprint-report
    restart: unless-stopped
    ports:
      # Bind to localhost only if a reverse proxy terminates TLS in front.
      - "8501:8501"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://localhost:8501/healthz').read()"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
